<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#wash)" fill-opacity="0.22">
    <ellipse cx="330" cy="200" rx="190" ry="120" fill="#C76B8A"/>
    <ellipse cx="400" cy="160" rx="130" ry="95" fill="#E58AAA"/>
    <ellipse cx="270" cy="240" rx="120" ry="80" fill="#F0A5C0"/>
    <ellipse cx="450" cy="250" rx="80" ry="60" fill="#A7476B"/>
  </g>
</svg>
